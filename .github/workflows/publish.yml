name: Publish web charts

on:
  schedule:
    # Day 1 of each month, 12:00 UTC. rengibbons.github.io's sync workflow
    # runs a day later so a release is always in place by the time it looks.
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --all-extras

      # Fails the job (and skips the release step below) if any live data
      # source errors out, so a bad month never overwrites the last good
      # release -- the website's sync workflow just finds nothing new.
      - name: Refresh the data cache
        run: uv run python scripts/build_cache.py --mode incremental

      - name: Export chart page
        run: uv run python scripts/export_web.py --output-dir site_export

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: site-export-latest
          name: Latest chart export
          body: Automated monthly export of the story notebook's charts.
          files: site_export/*.html
