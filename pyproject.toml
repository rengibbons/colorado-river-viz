[project]
name = "colorado-river-viz"
version = "0.1.0"
description = "Data visualization and analytics for the Colorado River: flow rates, reservoir levels, and snowpack"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "jupyterlab>=4.0",
    "requests>=2.32",
    "ipympl>=0.10.0",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.7",
    "mypy>=1.11",
    "ruff>=0.11",
    "pandas-stubs>=2.0",
    "types-openpyxl>=3.1.5.20260827",
    "scipy-stubs>=1.18.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colorado_river_viz"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits the real data APIs; run with `pytest -m network`"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true
