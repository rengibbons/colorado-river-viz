[project]
name = "myproject"
version = "0.1.0"
description = "Python project template"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "jupyterlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.7",
    "mypy>=1.11",
    "ruff>=0.11",
    "pandas-stubs>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myproject"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
